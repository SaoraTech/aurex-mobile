name: Mobile CI

on:
  push:
    branches:
      - chore/mobile-foundations
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: aurex-mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Expo SDK validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: chore/mobile-foundations
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconcile lockfile and SDK-native dependencies
        run: |
          npm install --package-lock-only
          npm ci
          npx expo install expo-secure-store
          npm install react-native-sse --save-exact
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore: lock mobile authentication dependencies"
            git fetch origin chore/mobile-foundations
            git rebase origin/chore/mobile-foundations
            git push origin HEAD:chore/mobile-foundations
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Check Expo package compatibility
        run: npx expo install --check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Export Android, iOS and web bundles
        run: npx expo export --platform all
