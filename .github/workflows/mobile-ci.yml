name: Mobile CI

on:
  push:
    branches:
      - chore/mobile-foundations
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: aurex-mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Expo SDK validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Expo package compatibility
        run: npx expo install --check

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Export Android, iOS and web bundles
        run: npx expo export --platform all
